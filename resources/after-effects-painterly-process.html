    <h1>After Effects as a Painterly Process</h1>

<script type="text/markdown" id="content">
After Effects is usually taught as a compositing and motion-graphics tool. This treats it as somewhere to take a mark you already made — a painted stripe, a found object, a shape you drew — and repeat it until the repetition becomes the image. Everything is built in a square frame, which fits the dome as it is and can be placed inside a wide frame later.

The **[worked workshop page](../ae-workshop/)** runs two complete paths end to end, one instruction per step, each with a short screen capture of that step being done.

## Be sceptical of fireworks

Some combinations produce impressive emergent effects with no effort — instant symmetry, endless spirals. They are spectacular and limited as a means of individual expression. For anything you make, ask: *could someone else have got this from the same settings?* If yes, it is fireworks. What keeps a piece yours is almost always the source: the mark you painted, the thing you found, the footage you shot.

## The parts

No fixed pipeline. Pick one from each column and see what the combination does.

**Sources**

- **Watercolour** — translucent; layers build colour.
- **Found object on white** — opaque; silhouette and structure.
- **Shape or pen tool** — clean geometry.
- **Your own video** — movement and time.

**Operations**

- Animate rotation, scale or position.
- Duplicate around a circle.
- Repeater.

**Combinations**

- **Multiply** — translucent layers build where they overlap.
- **Track matte** — one source becomes a window onto another.
- **CC Kaleida** — instant symmetry. Test it against the fireworks question above.

## Two worked paths

Both end in the same square export, and both are written out step by step on the workshop page.

- **[Path A — watercolour and repetition](../ae-workshop/#a).** A watercolour mark, repeated around a centre. Where copies overlap, the colour builds. Paint three patterns — nested shapes of colour, vertical lines, radial lines from a point — photograph them flat, then isolate one mark, spin it, and array twelve copies around the centre on Multiply.
- **[Path B — repeater and track matte](../ae-workshop/#b).** A drawn shape, multiplied by the Repeater, used as a window onto video. The shape alone is fireworks. The footage is where the piece becomes yours — shoot your own.

## One distinction worth holding onto

The Properties panel is for *setting* a value. The Transform twirl-down in the timeline is for *animating* one. They show the same properties and are not interchangeable — if a keyframe won't stick, that is usually why.

## Finishing

Export is the same for either path: add the composition to the Render Queue, set the format, render. The square is ready for the dome as it is; for a screen, place it inside a wide frame first. Both are covered in **[the export section](../ae-workshop/#export)**.

To check a piece on the dome, render one frame — **Composition → Save Frame As → File**, PNG — and drop it into a dome simulator. The centre of your square is straight up and distance from the centre is how far down the dome, so marks near the edge stretch. Keep important things within about half the radius. **[The Dome as Canvas](dome-as-canvas.html)** covers that geometry in full.
