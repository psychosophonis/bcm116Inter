There's a lot of expressive and aesthetic possibility in moving between analogue and digital media, and in mixing them so they animate — literally and figuratively — each other. This guide covers a set of custom browser tools plus a Photoshop workflow that support that kind of movement.

## The Browser Tools

Two browser-based tools let you take a folder of shot frames and turn them into either a **phenakistoscope** disc or a **flipbook**. Both run entirely client-side — nothing is uploaded anywhere — and both export a print-ready PDF, which you then cut out and assemble by hand. Full toolset: [psychosophonis.github.io/frame-animation-tools](https://psychosophonis.github.io/frame-animation-tools/).

**[The Phenakistoscope Tool](https://psychosophonis.github.io/frame-animation-tools/phenakistoscope-generator.html):**
Drop in a folder of numbered frames and it lays them out radially around a spinning disc, one wedge per printed page. Click a registration point that should stay fixed across every frame — a pivot, a joint, a fixed point on a rig — set a zoom, and that same crop is applied all the way round. Set how many divisions (segments) the disc has; 8 is the practical minimum for the illusion to read when spun, and there's no fixed maximum. A live preview flags overlapping frames and renders the full assembled disc before you print, and output splits across multiple sheets automatically if the disc is too large for one page — cut out the wedges and assemble around a shared centre point. The tool also has a blank mode: concentric ring templates, each ring with its own division count, for hand-drawing or collage directly onto guide lines with no photos involved. Because a phenakistoscope is viewed through a mirror while spinning, always print and test one wedge before committing a full sheet.

**[The Flipbook Tool](https://psychosophonis.github.io/frame-animation-tools/flipbook-generator.html):**
Drop in a folder of numbered frames and it imposes them four-up on A4 sheets sized to cut into A6 cards, with crop marks, borders and frame numbers so the stack cuts and reassembles in the right order. As with the disc tool, you pick a registration point that stays fixed across every frame so the flip reads cleanly, and choose between "contain" (whole frame, letterboxed) or "cover" (cropped to fill). A built-in flip-through preview lets you check the sequence reads correctly before printing, and there's an option to reverse play direction or choose bulk stack-cutting vs. cutting one sheet at a time.

If you're making a phenakistoscope, you can also export it as a PNG from the tool and test the spin digitally at [phenaspin.com](https://phenaspin.com), a phenakistoscope simulator.

The phenakistoscope tool also lets you print blank templates — with single or multi-ring guidelines at various sizes — for hand-drawn or collage experiments.

## Photoshop's Timeline Feature

The tools above expect a folder of frames as their starting point. Photoshop's Timeline feature is where you can make those frames in the first place, and — more usefully — where you can alter them by hand before they ever reach a generator. It's a powerful way to experiment with flash and re-animation techniques: import video frames as separate Photoshop layers, then step through those layers in the Animation Timeline, drawing, painting, or erasing on individual frames with the full range of Photoshop's tools — added marks, scratch textures, colour shifts, whatever the piece calls for. You can then export the finished timeline as a video, an animated GIF, or as numbered frames to feed into the Phenakistoscope or Flipbook tool above.

### Video → frame-by-frame animation

Shoot a short video — 5 to 10 seconds, thinking in terms of a phenakistoscope- or flipbook-length loop rather than a finished shot.

1. **Window > Timeline** to open the Timeline panel.
2. **File > Import > Video Frames to Layers.**

![The File > Import submenu, with Video Frames to Layers highlighted](../assets/images/content/ps-import-video-frames.webp)

3. Work out a sampling interval before you import: divide your clip's total frame count by how many frames you actually want. A 5-second clip at 30fps is 150 frames — for a 16-frame loop, that's roughly every 9th frame (150 ÷ 16).
4. Import at that interval, test the loop, and re-import at a slightly tighter or looser interval if it reads too fast, too slow, or jumps.
5. Each imported frame lands as its own layer, and Photoshop builds a frame-by-frame animation in the Timeline automatically — nothing further to set up.
6. Select a frame in the Timeline and its one corresponding layer lights up in the Layers panel. Select that layer, choose the paintbrush (or any other tool), and draw, scratch, or paint directly onto that single frame.
7. Step through frame by frame this way to build a digital scratch-style animation. A few frames altered and the rest left alone is usually more interesting than treating every frame the same.

### Stop-motion photos → animation

If you've already got a set of separate stills — stop-motion frames, a burst of photos, anything shot one image at a time — skip the video import and load them straight in as layers.

1. Shoot a series of successive stills: 16, for a phenakistoscope-length loop, for example.
2. Put them all in one folder, numbered so they're already in sequence.
3. **File > Scripts > Load Files into Stack.**

![The File > Scripts submenu, with Load Files into Stack highlighted](../assets/images/content/ps-load-files-into-stack.webp)

4. Select the folder or files. Try **Automatically Align Layers** if the shots weren't taken from a locked-off position — it's unreliable, so check the result by eye.
5. Each photo lands as its own layer in a new file. **Window > Timeline**, then click **Create Frame Animation**.
6. Open the Timeline panel's own menu (hamburger icon, top right) and choose **Make Frames From Layers**.

![The Timeline panel menu, with Make Frames From Layers highlighted](../assets/images/content/ps-make-frames-from-layers.webp)

7. From here it's the same Timeline workflow as the video method above: select a frame, select its layer, alter it by hand if you want to.

### Animating a still image (e.g. a Muybridge motion study)

You don't need video or stop-motion to get frames into the Timeline. Muybridge's motion studies are already laid out as a grid of sequential frames in one image — slice that grid apart and Photoshop will treat it exactly like an imported video sequence.

1. Find a high-resolution image of a Muybridge motion study (or any other multi-frame contact sheet).
2. Select the **Slice Tool**. It's nested with the Crop Tool and Slice Select Tool in the toolbar — click and hold to see the group, or press **C** then **Shift+C** to cycle to it.

![A Muybridge contact sheet open in Photoshop, with the Slice Tool selected in the toolbar, ready to be cut into individual frames](../assets/images/content/ps-slice-tool-before.webp)

3. Zoom in, then drag a rectangle over the first frame, snapping its edges to that frame's own border in the source image. Photoshop numbers the slice automatically and fills the rest of the canvas with grey, unlabelled "auto slices." Draw the next frame the same way, then the next — Photoshop numbers each slice in the order you draw it, so work left to right, top to bottom through the grid to keep the numbering in step with the actual motion sequence.

![Slice Tool mid-use on the same plate: each drawn frame gets its own blue numbered slice, with grey auto slices filling the untouched margins and gutters between them](../assets/images/content/ps-slice-tool-numbered.webp)

4. Precision here matters more than speed: check each slice's edges land exactly on the frame's own divider lines before moving to the next one. A slice that's even a pixel off on one side will make that single frame jump or judder on playback, out of step with the rest.
5. With only the frames selected: **File > Save for Web**, export as high-res JPG at maximum quality, and in the following dialog set **Slices** to **All User Slices** (not the default), then **Save**. This exports each slice you drew as its own numbered file, ignoring the grey auto slices.
6. Back in Photoshop: **File > Scripts > Load Files into Stack**, and select the folder or files you just exported. You can try the auto-align option, but it's unreliable — check it manually.
7. This produces a new file with each frame as its own layer, ready for the Timeline as in the stop-motion workflow above: **Window > Timeline**, then **Create Frame Animation**, then use the panel's own menu (hamburger icon, top right) and choose **Make Frames From Layers**.
8. Test the playback, then export as below.

The same slice-and-stack approach works for any multi-frame source image, not just Muybridge — old chronophotography, contact sheets, printed comic strips. Expect to burn through a few attempts before the aspect ratio, resolution, and slicing all line up cleanly — that's normal, not a sign you're doing it wrong.

### Exporting your animation

Once you've worked through your frame sequence, you have three export options:

- **As a GIF:** **File > Export > Save for Web**, choose GIF format, and set the animation loop option (bottom of the window) to **Forever**.
- **As a video:** **File > Export > Render Video**, then choose the appropriate export settings.
- **As individual frames** (for further manipulation, or for use in the Phenakistoscope or Flipbook tools): **File > Export > Layers to Files**, then choose your options. Photoshop will output all frames as JPGs into a folder.

To bring exported frames into the Phenakistoscope or Flipbook tool, open the tool and point it at that folder.
