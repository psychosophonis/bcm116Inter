    <h1>Writing Your Didactic Panel</h1>
    <p class="w-tagline">A didactic panel is a short text that stands with your work. Someone reads it in about twenty seconds, without having read the brief and without knowing which prompt you chose.</p>

## Caption

> Your name
> *Title*, Year
> Format and materials, duration or dimensions

## The panel: 150 words maximum

### 1. Two sentences on your source

**Sentence one: the original work.** Name it with its date. Describe the work, highlighting the aspects most critical to its influence on yours.

**Sentence two: your work.** Say what it does with those aspects. Start from what sentence one ended on: that position, that arrangement, that relation.

> Malcolm Le Grice's *Horror Film 1* (1971) puts the artist's body between the projector and the wall, where it interrupts the light and becomes part of the image rather than an audience to it. *Silhou-ette* gives that position to the viewer.

The first sentence names one aspect of Le Grice's film that is relevant here, and describes it physically. The second says what *Silhou-ette* does with that aspect.

### 2. What the viewer encounters

What they see, hear, or do. For a video or sound work, what is on screen or in the mix and how it was made. For an installation, what is in the space and how it is set up. Two or three sentences.

> The frames go up on a stairwell wall, a lift door, the tiles at a station underpass. Each is photographed where it is stuck, and the photographs are run back together so she moves again on surfaces built long after her. The sound is recorded at each site.

The material first, then what was done with it. A reader who has not seen the work can picture it.

### 3. What it is for

The idea, question, or feeling the work is after. One or two sentences.

> Interaction and playful engagement build a sense of safety, of distance, of play, that will eventually and inevitably be ripped away. Such is the experience of women today.

The claim arrives last, after the reader knows what produces it.

### 4. Credits, below the panel

Not counted in the 150 words. Declare any material you did not make: sampled or archival footage and audio, stock or template elements from editing and design tools, and any use of generative AI. Note where each came from and that you have permission to use it.

> Contains footage from the Prelinger Archives, public domain. Backing track and lower-third template from Canva.

---

## Examples

**Tessa Nordby**
*Silhou-ette*, 2023
Video projection, stereo soundtrack

> Malcolm Le Grice's *Horror Film 1* (1971) puts the artist's body between the projector and the wall, where it interrupts the light and becomes part of the image rather than an audience to it. *Silhou-ette* gives that position to the viewer.
>
> A camera watches the floor in front of a wall-sized projection. The viewer steps into that space and joins the shapes already moving on the wall. The soundtrack shifts with the viewer's movement. The work invites the viewer to identify themselves in the shadow, to play, to find out how much of it answers to them.
>
> Interaction and playful engagement build a sense of safety, of distance, of play, that will eventually and inevitably be ripped away. Such is the experience of women today.
>
> Contains footage from the Prelinger Archives, public domain.

**Amira Haddad**
*Attitudes*, 2026
Single-channel video, stereo sound, 2 min 40 sec

> Eadweard Muybridge photographed a woman descending stairs in 1887, twelve frames shot in sequence against a measured grid. *Attitudes* photocopies those frames onto transparencies and sticks them to the city, one frame at a time.
>
> The frames go up on a stairwell wall, a lift door, the tiles at a station underpass. Each is photographed where it is stuck, and the photographs are run back together so she moves again on surfaces built long after her. The sound is recorded at each site.

**Rowan Delacruz**
*Encapsulated*, 2023
Virtual reality experience, headphones

> Encapsulated means enclosed by a protective coating or membrane.
>
> teamLab's *Existence in Perception* (2023) uses light and projection to make the people moving through the installation part of what everyone else sees. *Encapsulated* takes that folding of the viewer into the work and puts it in a headset. The headset cuts the viewer off from one world in order to immerse them in another, a vast space of vibrant colour and obscure imagery without floor, scale or anyone else in it. Outside it, in the gallery, the body stays where it was left, turning and reaching at nothing the room can see.
>
> Encapsulation of perception leaves the body exposed. Exposed, the viewer is on display in the act of being cut off.
