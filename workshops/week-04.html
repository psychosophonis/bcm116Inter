Découpage is the process of breaking a cinematic scene down to work out how it operates and how it makes meaning. Today you're using it to reverse-engineer a recreation of one of your favourite scenes — aim to get as close a match to the original as you can. Next week, once you've shot and edited it, you'll upload your version at full resolution running side by side the original, so we can compare.

This week is analysis. Next week is shooting and editing.

Why bother? Because it forces you to engage closely with how a scene is actually constructed — the choices made in composition, lighting, blocking, and editing — the language of cinema, not just its story. It's also a real planning-and-execution exercise. And it's genuinely fun.

### Step 1 — Watch together

Watch your chosen scene as a full group, start to finish. How many shots can you see? How many positions within each shot? At each new position, take a screenshot — on a Mac, Shift+Cmd+5 captures a portion of the screen — and name the file for the position it captures.

### Step 2 — Split the analysis

Skim [this camera-shots reference](https://www.studiobinder.com/blog/ultimate-guide-to-camera-shots/) — we'll use its terms to describe and analyse your positions.

Divide the positions you captured among the group. Open the [shared Slides deck](https://docs.google.com/presentation/d/1DpASGcvfSBbpSTji3omGSKJOVAthZKaviDQN2QMRpcE/edit?usp=sharing) and, for each position, right-click the template slide and choose **Duplicate slide** — one copy per position. Drop in your screenshot and work through the grid overlay and:

- Transition in — cut, pan, track, or reframe
- How long is this position held?
- Motivation for this transition
- What's on the grid intersections, and why?
- In focus vs. out of focus — what's that directing attention to?
- If necessary, a map of the set-up: where are the characters, camera, and lights positioned, relative to each other?
- Reproducing this shot — lens, distance, height, depth of field, other notes
- Lighting — how and where is the position lit? Where's the camera relative to the light? Any practicals?

### Step 3 — Mark cuts and line the script

In the [découpage app](../resources/decoupage-blocking-toolkit.html), mark where each cut falls with a `{{...}}` marker inline while you rewatch, purely as a visual aid. Then line the script — drag out a span beside it to mark the extent of each shot. Each line marks a separate shot, and a separate take: we're shooting single-camera, one take per shot.

### Step 4 — Write shot descriptions

Once a shot's Slides analysis is done, come back to the app and write a one- or two-sentence description for that shot — the compressed version of what you found. This is what a director actually needs on set, not the full analysis.

### Step 5 — Block what needs blocking

Not every shot needs a blocking diagram. Use it for the ones where actor and camera position genuinely need working out before the shoot. If a shot involves movement — an actor crossing the room, a camera tracking with them — add waypoints to a marker's path rather than just its starting position, plotting the movement itself, not just where it begins.

### Step 6 — Build your shot list

Your shot list compiles automatically from what you've lined and blocked. Reorder it into actual shooting order, grouping shots that share a camera setup, rather than leaving it in script order. This is the whole point of the exercise: discovering that shooting order and story order aren't the same thing.

### Step 7 — Decide roles and scout locations

Decide now who directs, who's on camera, who's on sound, and confirm your cast. Keep these roles for the shoot itself. Scout your locations.

### Step 8 — Print

Export and print the full package — everyone in the group needs their own copy of the script, blocking diagrams, and shot list.

---

## Audio, for next week

Mic straight into the camera via XLR is the default. If a shot's geometry makes that awkward — actor too far from camera, angle puts a boom in frame — use a lapel mic on the actor instead. If a camera has no mic input at all, use a phone or Zoom recorder as backup audio, and clap in frame at the start of each take to sync it in the edit.

---

## Finished early?

Two options. Grab an XA70 and use it to test your chosen locations and rehearse your scene. Or start on your Investigation: read through the prompts, find an angle, do some research, and talk through directions with Mat and your classmates.
