Investigations 3 & 4 are due **Tuesday 27 October, 11:59pm**. Most of today is working time and consults. Let's start by thinking through the didactic panel, because it's a great way of working out what the work is, what it's trying to achieve, and who it's calling on to guide the way.

Have your work(s) in progress sitting in front of you, in whatever state they're in, and take some notes as you discuss them with the person next to you.

## Using the Didactic Panel to Think Through the Work

If you haven't started yet, that's fine: this is a great place to start (although you should have started by now. Panic stations!). Use the panel draft to find something you're inspired by, work out what you're going to take from it, and why you're going to take it and develop it.

## Today's Task

You'll draft a panel for one or both of your works, following the **[Didactic Panel Guide](../resources/didactic-panel-guide.html)** section by section. Where the proposed panel and the work don't line up, you decide which one changes. You should do this for both of your works if you're keeping Investigations 3 & 4 quarantined.

## Workshop Process (2 hours)

### Phase 1: Didactic Panel (25 min)

Write each section, then read it to the person next to you.

1. **Two sentences on your research** (6 min) - *Sentence one: what an artist or maker has done.* Name their work with its date. Describe what they did with the apparatus or idea, highlighting the aspects most critical to its influence on yours. *Sentence two: your work.* Say what your work does with that same aspect. *Silhou-ette* does it like this: "Malcolm Le Grice's *Horror Film 1* (1971) puts the artist's body between the projector and the wall, where it interrupts the light and becomes part of the image rather than an audience to it. *Silhou-ette* gives that position to the viewer." The panel names your research; the work has to show it.
2. **What the viewer encounters** (6 min) - Describe the work so someone who hasn't seen it can picture it: what is on the screen or in the space, what they hear, what they do. Name the material first, then what you did with it. Two or three sentences. *Silhou-ette* does it like this: "A camera watches the floor in front of a wall-sized projection. The viewer steps into that space and joins the shapes already moving on the wall. The soundtrack shifts with the viewer's movement." Read yours to your partner before you show the work. Can they picture it?
3. **What it is for** (4 min) - Say what the work is after: an idea, a question, or a feeling. One or two sentences. Build it from what you have just described, so the reader already knows what produces it. *Encapsulated* first describes what the viewer encounters: "The headset cuts the viewer off from one world in order to immerse them in another… Outside it, in the gallery, the body stays where it was left, turning and reaching at nothing the room can see." Then the claim: "Encapsulation of perception leaves the body exposed. Exposed, the viewer is on display in the act of being cut off." The viewer cut off and the body left behind are both in the description before the claim names what they add up to. Ask your partner: does what they heard in step 2 lead to your claim?
4. **Credits, below the panel** (2 min) - Declare any material you did not make.
5. **Make it true** (5 min) - There's a bit of "fake it till you make it" about a didactic panel. It can feel like spinning bullshit. The trick is to take the bullshit, which is really just speculative thinking about what the work could be about, and apply it to what you're making. Ask yourself: what would I have to do to make this panel true? Post your answer on Discord as your aim for today.

If you can't make it true before your due date, change the panel instead.

### Phase 2: Working Time and Consults (95 min)

- Put your name on the consult list when you're ready to talk. I'll take people in order.
- Work towards your aim. You can leave to shoot or record, but say so in your aim.
- Before you leave, reply under your aim with your next step. It's important that you tell me whether you're screening next week and what I can expect from you.
