This week we are playing with my favourite aspect of cinema's strategies of immersion; sound design.

Nearly every sound you hear in the cinema was put there by an editor. That sound generally comes from a commercial sound library, or is recorded with a field recorder kit by the sound effects editor. If it is human movement it might be recorded by a foley artist in a studio. Very little of what you hear in a finished film was recorded on set apart from the dialogue, and a lot of that gets rerecorded in a studio afterwards. We build a film soundtrack largely from scratch.

For the theory behind today — how a mix places every sound in a three-dimensional field, and the trick that lets two speakers put a sound anywhere between them — plus two warm-up exercises for your ear, see [Stereo Mixing & Spatial Sound](../resources/stereo-mixing-and-spatial-sound.html). Work through that first.

### Try this: record a university atmosphere

Take a Zoom recorder out and record a couple of minutes of atmosphere. The creek near building 29 generally has frogs, birds and wind, with the city and the traffic sitting behind them — a good example of a place where nothing stands out too distinctly. Bring it back and follow the atmosphere exercise in the resource above.

### Build a soundtrack from nothing

Once you are comfortable cutting, panning and combining, there is an animated sequence from the 2005 film *Robots* in the session folder with the sound stripped out. I have lent you fourteen gigabytes of my own sound library to work with. Animation is the clearest case of the point I opened with, because there was never a location, a set, or a microphone anywhere near it. Every sound in that scene was a decision somebody made.

Pick a section of the scene and build the sound for it. I have done one section to show you how I would start. Delete mine and start again if you would rather.

The [script for the scene](week-06-sample-script.html) is here too. Use the Zoom recorder to revoice the missing dialogue.

**Come and ask me** how I process dialogue with EQ and compression once you get to that point. All dialogue gets both. Compression takes the peaks of a signal and reduces them by a set ratio once they cross a threshold, which lets you lift everything else and produces a fatter, richer, more powerful sound. Nearly every sound you have ever heard in music production has been through this.

**Come and ask me** how to glue a mix together with reverb once you have something running.
