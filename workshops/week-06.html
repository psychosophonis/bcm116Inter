This week we are playing with my favourite aspect of cinema's strategies of immersion; sound design.

Nearly every sound you hear in the cinema was put there by an editor. That sound generally comes from a commercial sound library, or is recorded with a field recorder kit by the sound effects editor. If it is human movement it might be recorded by a foley artist in a studio. Very little of what you hear in a finished film was recorded on set apart from the dialogue, and a lot of that gets rerecorded in a studio afterwards. We build a film soundtrack largely from scratch.

---

## The mix as a box

Any mix of sound can be thought of as a box with three dimensions, and a good mix places every sound in its own position in that box.

The first dimension is the depth of the box, front to back, which is your level. A sound that is important, or close to the listener, needs to sit in front of the others. Dialogue in cinema is sacrosanct. It sits front and centre with nothing competing with it in level, position, or frequency.

The second dimension is position from left to right. We mostly work in stereo, and surround sound is an extension of that field. We place a sound in that field by panning it. Dialogue sits dead centre, which means equal level arriving from each side of the stereo pair.

The third dimension is frequency, and it is the one people forget. Two sounds can be at completely different levels and still fight each other, because they are occupying the same part of the frequency range. In cinema we make sure that nothing interferes anywhere near the legibility frequencies of dialogue, at between 1 and 6kHz.

The modern drum kit is the clearest model of all three dimensions working at once. Kick and snare sit centre and forward, where dialogue goes, toms and hats spread out to either side, and cymbals wash wide and high behind everything. The kick holds the bottom (50 to 100Hz), the toms fill the low middle (80 to 300Hz), the snare carries its body around 200Hz and its crack up at 3 to 5kHz, and the hats and cymbals sit above all of it (8kHz and up). Think of a kit as a richly constructed instrument that fills the whole bandwidth with clearly defined voices, each one holding a place the others have left open. A mix is doing the same job.

When I thought about what a creative sound designer actually needs in order to get started with sound as immersive media, it came down to one curious thing that calls straight back to Crary. Two identical sounds arriving from two speakers, left and right, produce the illusion of a sound coming from dead centre, as if a speaker were sitting there that is not. Your brain fuses like sounds arriving within about fifty milliseconds of each other, depending on the nature of the sound. Drop the level on one side and the sound shifts toward the louder side. That is how any sound gets placed anywhere between the two speakers, or the two ears.

This seems like a very small thing. It is the quality that makes sound richly immersive, and it is the source of Dolby Atmos.

It is also the stereograph again. Two sources sit slightly offset from one another, and a space appears that is present in neither of them. The stereograph gives each eye its own flat image and depth arrives in the observer. Two speakers do the same work on your ears. Two sources are enough to build a whole field around a listener, and once you can place a sound anywhere in that field you can hack binaural hearing into entirely new sonic worlds.

Successive difference has run through this subject since the second week. It has worked between images, then between cuts, and now between two sounds arriving at two ears. What emerges in the gap this time is a space.

---

## Try this: find the point where one sound becomes two

In ProTools or whatever you are working in, copy the same sound onto two tracks. Pan one hard left and one hard right. You will hear no real difference, because the sound is still centred.

Now shift one side later, incrementally, and listen for the point where the two stop fusing and become two separate sounds. How does the sound change as it comes apart? What happens spatially on the way through?

---

## Try this: record a university atmosphere

Take a Zoom recorder out and record a couple of minutes of atmosphere. The trick is to find a place where nothing stands out too distinctly. We are after the sound of the space, rather than the things in the space, and we want something with a bit of depth and interest. The creek near building 29 generally has frogs, birds and wind, with the city and the traffic sitting behind them.

Always get more than you think you need. Staying still and quiet and just listening is quite hard, so we tend to cut good atmosphere short.

Back in the studio, cut your atmosphere in the middle and lay the two halves side by side, one half on one channel and one on the other. Pan them left and right and listen. Any qualities the two halves share will meet in the middle, and the result should already be quite immersive.

That is only the beginning. Stretch, reverse and manipulate the sounds however you like, then shift them out of sync in various ways and pan them left and right, and some aspect will always meet across the stereo width. There is a lot of fun to be had here.

If you are in ProTools, get into the AudioSuite menu and use pitching to make big sounds small and, more fun, small sounds huge. Try pitching, reversing, and combining sounds that are slightly out of sync, then completely out of sync. What effects can you discover?

---

## Build a soundtrack from nothing

Once you are comfortable cutting, panning and combining, there is an animated sequence from the 2005 film *Robots* in the session folder with the sound stripped out. I have lent you fourteen gigabytes of my own sound library to work with. Animation is the clearest case of the point I opened with, because there was never a location, a set, or a microphone anywhere near it. Every sound in that scene was a decision somebody made.

Pick a section of the scene and build the sound for it. I have done one section to show you how I would start. Delete mine and start again if you would rather.

The script for the scene is in [the session folder](week-06-sample-script.html) too. Use the Zoom recorder to revoice the missing dialogue.

**Come and ask me** how I process dialogue with EQ and compression once you get to that point. All dialogue gets both. Compression takes the peaks of a signal and reduces them by a set ratio once they cross a threshold, which lets you lift everything else and produces a fatter, richer, more powerful sound. Nearly every sound you have ever heard in music production has been through this.

**Come and ask me** how to glue a mix together with reverb once you have something running.
