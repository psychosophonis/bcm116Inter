## The Story Circle

Dan Harmon (*Community*, *Rick and Morty*) took Joseph Campbell's Hero's Journey and simplified it into an eight-beat framework he's said he uses on every episode: the Story Circle.

![Dan Harmon's Story Circle: zone of comfort → want something → unfamiliar situation → adapt to it → get what they wanted → pay a heavy price → return to familiar situation → having changed](../assets/images/content/story-circle-diagram.webp)

It's culturally specific, not universal — but it's a useful analytical tool for working out what a story needs to feel like a story. Méliès is a good entry point, because his shorts often demonstrate how simple the structure can be:

1. **YOU** — a character in a zone of comfort
2. **NEED** — but they want something
3. **GO** — they cross a threshold into an unfamiliar situation
4. **SEARCH** — and adapt to it
5. **FIND** — getting what they wanted
6. **SUFFER** — at a heavy price
7. **RETURN** — to their familiar situation
8. **CHANGE** — having changed

Some beats can be compressed — folded into a neighbouring beat rather than getting their own card — but the *function* of each should still be present somewhere. Compression (folding a beat's job into another moment) is different from omission (leaving the job out entirely).

## The Méliès Template: "The Vanishing Lady" (1896)

**Our archaeological starting point demonstrates the power of simple story structure:**

[Méliès' "The Vanishing Lady" (1896)](https://www.youtube.com/watch?v=wmNGSCCIPiI) — the original stop-substitution trick this workshop is based on.

1. **YOU**: Woman sits in ordinary chair on stage
2. **NEED**: Magician wants to demonstrate his magical power
3. **GO**: Woman is covered with cloth (magic intervention begins)
4. **SEARCH**: Barely there — no real struggle — but it's the clearest example of a compressed beat: still present, just not given its own card.
5. **FIND**: Cloth removed - she's vanished! But when magician tries to bring her back, **a skeleton appears instead** (complication!)
6. **SUFFER**: Magician tries to bring her back
7. **RETURN**: Panicked magician fixes the trick, brings woman back safely
8. **CHANGE**: Audience relieved and amazed by his "recovery" powers

**Key insight:** The **complication** (skeleton instead of woman) creates the charm and humor. Without it, the trick is just technical demonstration.

Can you see the story cycle in [more of Méliès' trick films](https://www.youtube.com/watch?v=5DExmCKwQ8o)?

## Your Mission: Create Campus Magic (That Reveals Place & Country?)

**Using the story circle structure, create 2-3 minute silent films that reveal hidden aspects of campus life through impossible interventions. Consider how your stories might connect to broader questions of place, belonging, and what it means to be "here" in this specific location.**

---

## Workshop Constraints & Requirements

- **Silent film format** - no sync sound required
- **2 locations maximum** (studio + one campus location)
- **Locked-off shots required** for stop-substitution
- **Canon XA70 + tripod** - professional standards
- **3 minutes maximum duration**
- **Title cards required**: Opening title, credits, optional story cards

## Some Sample Scripts:

### Script Examples (Feel free to improve on these!):

All three run the eight-beat circle in full, as a model of the complete shape — in your own 3-minute film you'll often need to compress a beat or two, same as the Vanishing Lady's SEARCH above.

#### Example 1: The Parking Dilemma (Easy?)

1. **YOU**: Student desperately circling for parking before class
2. **NEED**: Must find parking space in the "no parking" campus
3. **GO**: Magic makes their car disappear to create a free spot
4. **SEARCH**: Struggles to get the magic to work appropriately
5. **FIND**: Perfect spot achieved
6. **SUFFER**: Loses the car to **another student's magic** (complication!)
7. **RETURN**: Student chooses to take the bus instead
8. **CHANGE**: Realizes stress-free journey more important than parking wars

*Place/Country Connection: Car culture vs. public transport, urban campus vs. commuter reality*

#### Example 2: International Student Conformity (Harder)

1. **YOU**: Two international students, together, both feeling obviously foreign on campus
2. **NEED**: Both want to fit in, stop standing out — together they wish it away
3. **GO**: Magic transforms them both into "ideal" local students
4. **SEARCH**: They calibrate the disguise, delighted it's working
5. **FIND**: It works — they blend in perfectly, campus fills with identical students
6. **SUFFER**: They lose each other in the crowd — turn to find their friend and see only rows of identical strangers (complication!)
7. **RETURN**: Magic reverses on both of them at once — the same act that made them vanish into sameness is what makes them visible to each other again
8. **CHANGE**: Realize the magic that made them fit in is what made them lose each other — real connection needs difference, not disguise

*Place/Country Connection: What does "Australian" look like? Who belongs in this place? Cultural diversity vs. conformity*

*Production note: this one leans on a crowd scene (identical extras, or one actor multiplied via mask/stop-substitution) rather than a second location — simplest version is a locked-off shot where the two leads simultaneously pop back to themselves mid-crowd and lock eyes. No green screen required.*

#### Example 3: Campus Romance (Easy)

1. **YOU**: Lonely student on eerily quiet campus
2. **NEED**: Wants love/companionship but campus too quiet to meet anyone
3. **GO**: Magic creates bustling party atmosphere around campus
4. **FIND**: Spots attractive student, but **party too noisy/chaotic for intimate conversation** (complication!)
5. **RETURN**: Student actively dismisses magic to quietly approach crush in peaceful silence
6. **CHANGE**: Discovers quiet conversation perfect for romance - better than party chaos

## Workshop Schedule (2 Hours)

### Opening (15 minutes):

- **5 minutes:** Live demo of stop-substitution (Vanishing Lady technique)
- **5 minutes:** Screen example films
- **5 minutes:** Point to the technical guides, form groups, choose scripts

### Production (80 minutes):

- **20 minutes:** Story planning and shot listing
- **50 minutes:** Shooting with equipment rotation
- **10 minutes:** Basic assembly

### Screening & Analysis (25 minutes):

- **15 minutes:** Screen all silent films
- **10 minutes:** Discussion: What apparatus affordances did you discover? How does magic serve story transformation?

---

## Learning Objectives

- Master story circle structure for transformative narratives
- Execute basic Méliès techniques with professional equipment
- Create place-based impossible worlds serving assessment goals
- Experience silent film storytelling constraints and affordances
- Develop technical skills through practical creative application

**Archaeological Question:** What does this apparatus afford for creating impossible worlds that other media cannot? How does in-camera magic differ from post-production effects in creating wonder?
