Coming up with a set of instructions and following them diligently to produce an aesthetic or semantic result has been a common strategy in contemporary and media arts. By suspending the agency of the artist, we create the opportunity to stumble upon emergent results: results that surprise us, that strike us with wonder, that offer new opportunities for expression.

David Hockney's photocollages are one version. The portraits and prints of (now disgraced) Chuck Close, which used intricate mapping of colour swatches to produce an emergent portrait, are another. Both work at the level of the individual artist and technique. Sol LeWitt's Wall Drawings, which we looked at in the pre-workshop video, take a different approach: instructions and human executors produce large-scale drawings and paintings. In that video we also looked at procedural generation that extends into collaboration, once again through a carefully constructed set of instructions and process.

![David Hockney, *Pearblossom Hwy.*, 1986, photographic collage](../assets/images/content/hockney-pearblossom-hwy.webp)

![Chuck Close, *Leslie*, 1986, woodcut (detail)](../assets/images/content/close-leslie-detail.webp)

![Time-lapse of Sol LeWitt's *Wall Drawing #797* (Blanton Museum of Art)](https://www.youtube.com/watch?v=Gc-c-pYGCrw)

This is a wonderful hack if you think of yourself as "not creative": set up a process with refined instructions and execute it at a large scale. Much immersive installation work uses this trick. Zimoun was the example in the lecture. His work is all material, but extend the same principle to computers and object-oriented programming and it becomes the very essence of immersive media. Of course, this links back to Crary's successive differences.

![Zimoun, Le Centquatre, Paris, 2017](https://vimeo.com/210592389)

[PostSecret](https://postsecret.com) is a bit different. Since 2004, Frank Warren has invited anyone to share a secret they have never told anyone, anonymously, on a postcard. The instruction card has three steps: take a postcard, tell your secret anonymously however you wish, stamp and mail it. The instruction is the same for everyone; the secrets and the cards are all different.

![PostSecret's instruction card, "Share a Secret"](../assets/images/content/postsecret-share-a-secret.webp)

## Today's Task

Today you'll create a precise instruction set that fellow students can follow. Your instructions will allow any person to produce and upload (to your group's folder in the class OneDrive) a short video that, when assembled with everyone else's, might reveal emergent qualities none of us could have planned.

Start with the repetition: hold as much as possible still, so the difference can show. Then decide where the variation comes from: human interpretation, different bodies, different executors, time, or built-in chance.

When you design your instructions, consider how the material might be assembled: as a grid (all playing at once), in a row or 360 ring (positioned around space), as columns or a triptych across screens, or as a montage (playing one after another). You might also consider phase: playing the same material with offset start times to reveal temporal patterns. Or consider connection between frames: a match on movement, the passing of an object from one frame to the next, the continuation of a line. I'll do the assembly, so focus on the instructions and the material they produce. If you'd like to try assembling some yourself, the **[Week 10 step-by-step guides](week-10.html)** show you how, but it isn't required.

## Four Bad Ideas (Come Up With Your Own)

### Template 1: Line Drawing

**Instructions:**

- Mark two points on A4 paper (mid-left, mid-right)
- Film a subject drawing a continuous line connecting left to right, taking exactly 20 seconds (pen doesn't lift). Use a timer.
- Film: paper fills frame completely, 5 sec static before you start, 5 sec static after completion

**What to look for:** everyone interprets "line" differently, and every hand moves differently.

**Assembly possibilities:** Grid (simultaneous comparison), Montage (rhythmic accumulation), Row/360 (line extends around VR space), Phase (offset start times create temporal rhythm)

**Variations:** Pass the paper and add to the drawing (exquisite corpse), Draw with your non-dominant hand, Let the line fold into a word in response to a prompt, Separate portrait of drawer

### Template 2: Leaf in Palm

**Instructions:**

- Find a leaf, start with an empty open palm in frame (fingers relaxed)
- Drop the leaf into your palm, hold still for 10 seconds, then tip it out so the palm is empty again
- Film: palm fills frame completely, natural light, 15 seconds total
- Place the leaf back where you found it

**What to look for:** different leaves and different hands, in the same frame and the same time. Because each clip starts and ends on an empty palm, it loops cleanly.

**Assembly possibilities:** Grid (simultaneous variety), Montage (gesture rhythm), Row/360 (turn through many hands)

**Variations:** Turn the leaf slowly (reveals both sides), Hold beside face (portrait context)

### Template 3: Face and Hand

**Instructions:**

- Film two separate 15-second clips of each person, using a timer for both
- Face: head and shoulders, plain background, eyes closed. At 5 seconds open your eyes and look straight into the lens. At 10 seconds close them
- Hand: back of the hand to the camera, fingers open, plain background. At 5 seconds close it into a fist. At 10 seconds open it again
- Film: same framing for every face (eyes on the top-third line) and every hand (hand fills the frame), natural light
- Start each file name with face or hand, without your name, so faces and hands can be sorted but not matched

**What to look for:** which hand belongs to which face? We don't know, and that's the point. Each clip starts and ends the way it began, so it loops.

**Assembly:** Two rows or rings (faces above, hands below), Grid (faces and hands mixed), Phase (offset start times)

**Variations:** Breath (no movement, just three slow breaths, face and hand)

### Template 4: Jump In, Jump Out

**Instructions:**

- Phone on the ground, side-on, square frame. Mark a landing spot one big step from the lens, in the centre of the frame
- Empty frame for 3 seconds. Jump in from the left and land on the mark with both feet. Hold still for 3 seconds. Jump out to the right. Empty frame for 3 seconds
- Film: feet only, 10 seconds total, always left to right. Use a timer

**What to look for:** different feet, different ground, the same jump. Each clip starts and ends on an empty frame, so it loops.

**Assembly:** Row/360 (the jump travels around the viewer), Phase (time each entry to follow the previous exit)

## Workshop Process (2 hours)

### Phase 1: Design (30 min)

1. **Read templates** - Review examples and understand principles (5 min)
2. **Form groups and design instructions** - You'll be assigned to one of three groups. Each group designs one instruction set with maximum detail and precision (20 min)
3. **Blind test** - Can someone execute your instructions? Do your instructions produce the kind of variation you wanted? What's unclear? (5 min)
4. **Refine** - Update instructions based on feedback (5 min)
5. **Set up upload** - make a folder for your group in the class OneDrive (I'll share the link in class), named by tutorial and group number (e.g. tut1grp1). Agree a file naming convention and add it, with the folder name, to your instructions. Don't move or delete anyone else's files (5 min)

### Phase 2: Execute (60 min)

1. **First iteration** - Work in pairs, execute your group's instruction set, collect 10+ iterations per instruction set (20 min)
2. **Review as a group** - Watch results together. Decide which differences matter. What's working? What creates noise? Is it interesting? Most of it won't be yet, and that's normal. (10 min)
3. **Refine instructions again**
4. **Cross-contribute** - Post your instructions and your OneDrive folder name together on Discord
5. **Collaborate** with other groups to produce as many responses as possible to each instruction set

**Target:** each instruction set has 20+ iterations by end of class, and 50+ by the end of the week. More is better: emergence usually needs hundreds of repetitions, not ten.

### Phase 3: Extended Contribution (During Week)

1. **Contribute to other instructions** - check Discord/Moodle for instruction sets from other tutorial times, contribute to as many as possible. This is your Discord participation for this week. I think it's reasonable to expect 1 contribution from each person to each group. Try to contribute to every instruction set by Sunday.

## Specifications Reference

When designing your instruction set, specify:

**Media Format:**

- Aspect ratio: square (1:1) works best for grids, columns and the 360 ring
- Audio or silent?

**Framing & Composition:**

- What fills frame? Be specific: "palm fills frame completely" or "subject top third, 4/6ths width"
- Shot inside or outside?
- Background requirements?
- Lighting?

**Duration & Timing:**

- Total clip length (fixed, not a minimum, so clips can be offset in phase)
- Timing of actions

**Shoulders:**

- Static seconds before and after action?
- Does the clip end the way it starts, so it can loop?

**Audit Your Instructions:**

- Is the repetition defined clearly? What is being held still?
- Where does the difference come from?
- Will the difference still be visible when the clip is small in a grid?
- Can someone execute the instructions without asking questions?
- What might emerge when accumulated?
- Which assembly methods might work?

## Deliverables

**By end of workshop:**

- 20+ contributions to each group

**During week:**
