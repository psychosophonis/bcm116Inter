Two ways to work today. Either build a **sound walk**, a headphone experience that guides a listener through a real place, or compose for the **six-channel array** in the video studio. Pick one. Both are described below, sound walk first.

---

## Sound walks

A sound walk guides a listener through a real place using recorded audio played in headphones. As they move, narration and sound design shape what they notice, feel, and imagine, turning an ordinary walk through a familiar space into a composed experience.

Cardiff and Miller call this physical cinema. Their [*Alter Bahnhof Video Walk*](https://cardiffmiller.com/walks/alter-bahnhof-video-walk/) pairs recorded video and sound with a real train station, so the recorded world and the real one overlap as you walk. Watch it to see the full technique at work. To keep things achievable here, we'll leave the video aside and build the whole experience with audio alone.

The recording directs the listener. Every instruction says what to do next, present tense, direct address, "keep walking," "stop here," "look at this," never assuming the listener is already somewhere or already knows something. Build in a fallback for anything that depends on the real world cooperating. If a door might be locked, write both versions. If a person might not walk past, write what happens if nobody does.

### The core method

Below are some of the techniques I've been playing with in developing this workshop. Start by reading the [two example scripts](week-08-example-scripts.html) together, as a group, and ask yourselves: would they actually work, walked, in headphones, in the real place? How well? Where would they lose you? You can borrow from either, and alter them at will. You could write your own simple version, or it might be just as interesting, and more productive, to run through the structures below. In short, a sound walk works by directing attention so deliberately that the listener experiences an ordinary place differently than they would alone. That's what we're experimenting with.

**Direct the body in the space.** Tell the listener exactly where to go, where to stop, where to look, when to close their eyes. Move them, tell them where to look and what to pay attention to. Attention starts with the body's position, gaze, and listening.

**Attend to the body itself.** Instructing the listener to notice their own body and its relation to the world is a strong immersive effect, notice the wind or the sun, breathing in and out, their breath, their pulse, their skin.

**Coordinate action to deepen attention.** Instructed action that enhances attending, or a relation to the world, works well, slow counted breathing, feeling the grass beneath their feet. But make it mean something, evoke a memory, recall a feeling.

**Use real and recorded sounds to seed story.** The sounds already in a place can carry narrative and contemplation if you point attention and assign listening time to them, traffic on Mount Ousley, students in the corridor. It's much more reliable to use edited audio to seed story elements according to place. This lets you not only ensure the crowd in the corridor can be heard, but turn it into a protest, or an overheard conversation. Try naming a sound and letting the listener build the story it implies, where's that truck going, what's it carrying, who's driving it through the night.

**Let phenomena trigger imagining.** Point at something real or seeded, a sound placed in the soundscape, and physical, the wind, the changing light, a shadow's edge, birdsong, and ask the listener to imagine outward from it. The real thing is the seed; their imagination does the rest.

### How to produce your sound walk

**Open with an anchor. This is the one step you can't skip.** The very start of your file has to tell the listener what this is and get them to the right spot before anything time-sensitive begins. Something like: "This is a sound walk. Make your way to the bench outside the glass doors, and pause the audio there. Press play again once you're seated and ready." Everything you've timed depends on the listener starting from exactly the right place.

**Write it.** Think carefully about what's at stake. Why is it worth doing? What does it change? How is it more than a series of commands?

**Walk it and time it.** Take your script into the actual space and walk it at a real pace. Note how long each stretch takes. This tells you how much narration fits between one instruction and the next, and where the silences need to be.

**Plan for the real world.** What happens if a door's locked, or the space is empty, or nobody walks past when you need them to? Write the alternative into the script so it works either way.

**Decide how it's voiced.** Is the narrator a "voice of god," speaking about the space from outside it, or an "internal voice," the listener's own thoughts, close and intimate? This changes how you write and how you record.

**Decide how it's timed.** Will you perform it live, speaking at the listener's actual walking pace, or edit it to a fixed timing they walk along to? Live is simpler; edited gives you sound design and control but requires you to have taken precise times between waypoints and audio cues.

**Record it.** In the space, in real time, or in the studio? Ask Mat or Riley about studio recording if that suits your piece.

**Edit, sound design, and mix.** Once you have your components, the narration, the recorded sounds, any music, bring them together in ProTools. Lay the narration on one track. Add your atmosphere and effects on separate tracks underneath it. Set the levels so the voice stays clear and the sounds sit under it without drowning it. If you're building an edited, timed walk, this is where you line the sounds and cues up to the timings you took when you walked it. Ask Mat for help with editing and mixing once you have your components together, this stage is easier shown than written.

**Bounce your mix.** Select the time span you want to export by dragging across it in the timeline. Then go to **File > Bounce Mix**. Set File Type to **WAV**, and tick **Add MP3** if you also want a smaller file for sharing. Choose where it saves under **Location**, and click **Bounce**. Check the Mix Source is set to your actual stereo output before you bounce, or just ask Mat, this is the step most likely to catch you out.

**Test it on someone.** The walk only exists once another person walks it. Put the headphones on someone else, send them off, and watch where it works and where they get lost.

### Collecting sound

Think about how recorded sound can enhance and extend your immersive experience. When you're in the field, gather sounds that might help, atmosphere, a specific event, something you could seed a story from later.

There are two different things recorded sound can do, and both are worth using:

**Intensify what's already there.** Record the real space, on location, and play it back low to sharpen and deepen what the listener is already half-hearing, the creek at the actual creek, the wind, a room's own ambience. The recorded real and the actual real reinforce each other. This is the most reliable way to make a space feel more present than it does on its own.

**Seed a haunting or a fiction.** Add sound that isn't really there, to layer an invented past or an alternative onto the space, the ghost of things once made in a studio, a crowd turned into a protest, a voice from another time. This is where recorded sound builds story rather than just atmosphere.

Remember that a stereo atmosphere can be very immersive, and it's best constructed deliberately. At the very least, take two sections of one recording and pan them left and right to open up a sense of space. When you're recording in place, take an extra two minutes of sound at each location, you'll want the length to work with when you edit.

Record what you can yourself, it'll be specific to your place and yours to use freely. If you need sounds you can't record:
- The **BBC Sound Effects library** is free for non-commercial use.
- **Freesound** has both field recording and music, of varying quality.
- The **Free Music Archive** has a lot of openly licensed music (requires an email login).
- If you need a particular sound you can't find, ask me, I might have it.

### Editing

We used ProTools last week, so that's the sensible and available option. You only need tracks and basic editing for this, and you can keep it simple. If you'd rather use Hindenburg, Audition, Fairlight, or Live, that's fine, you do you.

### Sharing

Upload your bounced file to SoundCloud as an unlisted track. That gives you a link that plays in any phone browser, no app, nothing for your listener to install, headphones in and go. A free SoundCloud account is enough. Share the link to Discord so others can try it. If your walk is performed live rather than edited, you don't need to distribute anything, you just deliver it in person.

### Up for a challenge?

Mat's favourite media experience ever was made by Blast Theory. It used two audio files, listened to synchronously in headphones by two different people, to choreograph a story shared between them, built out of their guided interaction with each other in a place. If you can pull that off, I'll be very impressed.

## Option 2: The six-channel array

Look to Cardiff and Miller's [*The Forty Part Motet*](https://cardiffmiller.com/installations/the-forty-part-motet/) and [*The Murder of Crows*](https://cardiffmiller.com/installations/the-murder-of-crows/), both build a whole experience out of many discrete sources, each on its own speaker, discovered differently depending on where a body stands.

**The main constraint, worth understanding.** Every independent, synchronous channel of audio needs its own DAC, its own digital-to-analogue converter. That's why true multi-channel synchronous sound requires expensive equipment, and it's a real limiting factor for surround and installation work. It's why you don't see six-channel pieces everywhere, the hardware to play them back properly is costly and specialised.

**So today we keep it simple.** No panning, no complex mixing. You're building a sound field out of six separate parts, one per speaker, arranged in space. The question is: what sounds can you source or record that will work well together across six points, with as little editing as possible?

A single atmospheric recording, frogs, a crowded room, rain, might split well across several of the six channels, each carrying a different part of the same source, so the field surrounds a listener. Leave a channel or two for something distinct that plays against the rest.

### How to export your six tracks

Build on six tracks, one per speaker, then bounce each to its own file to hand to Mat:

1. Select the tracks you want to export in the Mix or Edit window (Shift-click to select multiple).
2. Make a timeline selection covering the whole sequence, so every track exports the same length.
3. Right-click any selected track nameplate and choose **Track > Bounce**.
4. In the dialog, set File Type to **WAV**, Format to **Mono (Summed)** for mono tracks or **Stereo Interleaved** for stereo, and match your session's Bit Depth and Sample Rate (e.g. 24-bit, 48 kHz). Set the destination folder and naming.
5. Click **Bounce**. Pro Tools renders each selected track to its own file.

**Output:** six individual files of equal length, named Track 1 through 6, played back through six speakers in sequence. This needs to be ready to play back thirty minutes before class finishes.
