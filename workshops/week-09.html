This one is optional, and it's a code track. If you're comfortable with (or want to try) p5.js and you'd rather build a generative, procedural work than shoot or edit one, this is a way in — and it aims at somewhere real, not just a browser preview.

A dome master is a square image whose inscribed circle is the whole sky: centre straight up, rim at the floor, distance from centre is how far down you're looking, angle around is which way you're facing. Most of it is ordinary p5.js on a square canvas — no special maths until something needs a real-world distance. **[The Dome as Canvas](../resources/dome-as-canvas.html)** in Learning Resources has the full technique menu and links to the live browser tool, which needs no install to start playing with.

### Why a dome, specifically

**[Science Space](https://www.sciencespace.com.au/planetarium/)**, on UOW's Innovation Campus, runs Australia's most digitally advanced planetarium dome, powered by DIGISTAR 6. It's a real, local, fulldome venue, not a hypothetical one. That's the target worth building toward: work made for a flat screen and work made for a dome are not the same problem, and this is your chance to actually work on the second one.

### Taking it further

If this is the direction you want to push a piece in, come and talk to me before you're deep into it, especially about anything you'd want to actually put in front of an audience on a real dome. Delivery specs and export workflow are covered on the resources page.
