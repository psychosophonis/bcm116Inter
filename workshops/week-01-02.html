Over the next two weeks you'll explore five devices, all options for Investigation 1: the phenakistoscope, thaumatrope, flipbook, 16mm scratch, and VR/OpenBrush. If one holds you more than the others that's fine — but try to get a sense of the full range, and think about how they relate to each other.

A few of Crary's devices aren't part of these exercises — the stereoscope/stereograph, the kaleidoscope, and the panorama. We'll meet these later, at least in contemporary form, but they're worth keeping in mind as you move through the ones below: what difference and opportunity might they open up together, and how do they differ from each other?

At each station, think through three aspects: **technical** — what affordances and constraints characterise the device; **poetic** — what poetics are suggested by the device and its media form, what you could do with it, where its creative potential lies; **wonder** — whether you experience it, in the device itself or in its contemporary use, where it occurs, and how you might harness it.

No fixed rotation — go where your interest takes you across both weeks. If VR is busy, put your name on the whiteboard list.

## WEEK 1 — First Contact

**Station 1 — Crary's Devices: Thaumatrope, Phenakistoscope, Flipbook**
Research before you start making. Investigation 1's prompts each link to examples and contemporary versions of the device in creative use: [thaumatrope](../prompts.html#a2-p1), [phenakistoscope](../prompts.html#a2-p2), [flipbook](../prompts.html#a2-p3) (including Andymation's flipbook showcase and tutorials).

*Technical: what are the affordances and constraints of each device?*

*Poetic: is there a poetics suggested in the examples?*

*Wonder: where, if at all, is wonder apparent in the device and its use? How would you start to explore that?*

**Station 2 — 16mm Cameraless Film**
Since the 1930s, artists have made films without a camera — scratching the surface, colouring it with dye, painting it, bleaching it, sticking material to it, cutting and reassembling lengths to foreground the film's own materiality. Start with the great, still underappreciated, New Zealander Len Lye — a world-leading proponent — alongside the further [scratch/cameraless cinema examples](../prompts.html#a2-p4) under Investigation 1. Full technique menu in [Physical Film Techniques](../resources/physical-film-techniques.html).

Then experiment yourself. Treat it as frame-by-frame animation if you like, or go further and manipulate lengths of film for their own effect — the discovery is in trying: make, test, make again.

*Technical: what are the affordances here?*

*Poetic: is there a poetics in evidence — in the historical examples, or your own experiments?*

*Wonder: is there wonder, and if so where does it lie? What could you use the technique for, creatively?*

**Station 3 — VR**
If you're new to a headset, start with First Steps — Meta's primer, and something of a wonder in itself. Then choose one of these to sit with properly:

- *Dear Angelica*
- *Notes on Blindness*
- *We Live Here*
- *Home After War*
- *On the Morning You Wake*

*Technical: what are the affordances of the medium?*

*Poetic: is there a poetics evident, and how is it best realised?*

*Wonder: where are the moments of wonder? What would you make with this device if technical know-how were not a limit?*

**Before next week**
Take home the [Make a Phenakistoscope, Thaumatrope, or Flipbook](week-02-homework.html) brief, due end of Week 2.

---

## WEEK 2 — Working Session

Same three stations, with a more focused eye on the Investigation 1 prompts and what you might do with them. Start thinking about settling on a device and making plans for Investigation 1.

If VR has held your attention, try OpenBrush — are there possibilities for exploring VR's poetics in this consumer-grade creative application?

**End of Week 2 — Device Brief**
Post to Discord before Tuesday's Week 3 class:
- Device: thaumatrope / phenakistoscope / flipbook / scratch / VR–OpenBrush
- One sentence: what you want to make or test, and why.
