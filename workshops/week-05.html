### Step 1 — Confirm your package

Every group member should already have their own printed script, blocking diagrams, and shot list from last week. If anyone's missing theirs, sort it before gear gets distributed, not mid-shoot.

### Step 2 — Confirm roles

Same roles as last week — director, camera, sound, cast. No renegotiating on the day.

### Step 3 — Shoot in shooting order, not script order

Work through your shot list in the order you built it, grouped by setup, not the order the shots appear in the story. This is the entire reason you built the list this way.

### Step 4 — Use your blocking diagrams on set

Where you've got a blocking diagram, use it as your actual reference for actor and camera position — including any movement paths you plotted — rather than re-deciding blocking from scratch in the moment.

### Step 5 — Apply the fundamentals

Aperture for the depth of field the shot needs, watching the exposure meter as you light to match it. Lighting for shape, not just brightness — check where shadow falls on a face against what you learned last week. White balance checked against skin tone, not left on auto. Gain at 0dB unless aperture and lighting genuinely can't reach correct exposure without it.

### Step 6 — Audio

XLR by default, lapel where geometry demands it, phone or Zoom plus a clap for sync if there's no mic input at all.

### Step 7 — Quick assembly

If time allows, a rough assembly before the session ends, following the shot list's structure, gives you something to check your coverage against before you've lost the setup.
