Last week we analysed your chosen favourite scene in very close detail. That process should have given you clear insight into what makes that scene tick — how it constructed a sense of coherent cinematic space, movement, and action. You should have also noticed the nuance of the film's poetics — its making of meaning and feeling via composition, blocking, editing, light, and colour.

The most important part of the exercise is that close reading. As we attempt to reengineer that scene's formal composition today you'll notice we can't get close on some aspects. When that occurs, ask why. What would we need in terms of gear and resources to make it happen? What's beyond our reach, and why? Similarly, when we reengineer and it kind of works — when we get close enough to the formal elements and the magic of the scene is convincingly reengineered — ask yourself what makes it work, what were the important elements of composition you accurately hit.

### Shoot by setup

Today we want to get out and film our whole shortlist for editing. Shoot the list grouped by setup, not script order — a shot-reverse-shot sequence would be one setup with two or three shots; a wide establishing shot, two-shot, MCU of both characters, a shot of Char 1, and reverse shot of Char 2 would be others.

### Audio

Mic straight into the camera via XLR is the default. If a shot's geometry makes that awkward — actor too far from camera, angle puts a boom in frame — use a lapel mic on the actor instead. If a camera has no mic input at all, use a phone or Zoom recorder as backup audio, and clap in frame at the start of each take to sync it in the edit.

One of the key challenges today will be getting good audio, so make sure you're calling clearly. On a film set we'd traditionally call:

1. 'Roll Sound' — response, 'Sound Speed'
2. 'Roll Camera' — response, 'Speed'
3. Mark it — response, 'Scene 34, Take A3' (clap)
4. Pause… 'Action'
5. Cut

This will feel a bit silly, but it'll help keep your shots identified and make it easier to assemble if you're well organised and have clearly labelled your takes. Grab plenty of what I call shoulder — leave a beat between your mark and your action, and another between your action and your cut.

Have someone (perhaps the camera operator) record what takes are keepers and what are refused on set, so when you get back they're easy to identify.

### Studio access

The studio is available to use as a dark space, but please ask for help if you need to rig lights, and do not touch the studio cameras or news set without asking. If you're working in the studio, please complete the induction (the QR code is on the studio door).

### Editing and submission

The aim today is to complete the shooting and distribute the footage so everyone has another chance to practice their editing in Adobe Premiere or DaVinci Resolve. Choose a primary editor who'll edit and submit your workshop proof (only one version needed) to YouTube and share it on Discord.

I want two versions of your final scene — one exported at full resolution, and another running side by side with the original so we can analyse what you got right and what needed improving. It should match shot for shot in the edit.
