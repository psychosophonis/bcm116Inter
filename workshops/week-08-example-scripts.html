Two full worked examples. Borrow from either, and alter them at will.

---

## Example 1: The courtyard

**Site:** courtyard outside the main doors, a garden bed and old tree, a raised teaching platform, open grass, a line of trees with a creek, Mount Keira beyond.

**1. Here.** Stand where you came in. Feet together. Don't walk yet.

Close your eyes. Listen. What can you hear? Trucks on the distributor. Wind in the tree. People, somewhere.

Which speaks loudest here? What is it saying? What's being spoken over?

Open your eyes. Look at the building. Follow its edge with your eyes, from the ground up, along the top, down the other side.

Somebody drew that line on paper before it was built. What did they want?

Look at the windows. Find a person in one. If there isn't one, look at a window where a person would be.

Where have they come from this morning? Where are they going next? What are they following? What's moving them? What do they want?

Breathe with them.

Now you. What brought you here? What line are you following? Why?

**2. Bed.** Look at the tree. Walk toward it. Stop where the garden bed starts.

Look at the bark. It's coming away. The trunk got wider and the old skin split. It does that once a year. Swell, split, shed, swell.

Breathe with the tree. In, it swells. Out, it sheds. One breath, one year. It was doing this before the building was here.

The tree draws lines too. Roots toward water, feeling for it. Branches toward light. Look up at the edge of the canopy. That's where the branches stopped.

Now look down at the edge of the bed. Somebody looked at the tree first, then drew that.

**3. Edge.** Walk to the platform. Step up onto it. Sit if you want to.

This is where you're taught.

Look at the building from here. Every room has someone in it, or will. Teaching. Studying. Trying to find something out.

What are they working toward? How far ahead are they looking? What do they want?

People have been taught on this Country for at least sixty thousand years. The platform is new.

Stand up. Keep going. Across the platform, and down onto the grass.

**4. Grass.** Look across the grass. There's the forest. It runs in a line. Look along it.

The trees follow the water. What do they want?

Look up. Past the forest. The mountain. Find the line where it meets the sky.

Bring your eyes down from the mountain to the trees, the way the water comes.

Close your eyes. Listen for the water. Now the birds. Now the wind. Which side of your hand?

Open your eyes.

**5. Trees.** Walk across the grass, into the trees, until you find the water.

*(a low recording of this creek, made at this spot, rising gently as the listener reaches it, sharpening the real sound they're now standing in)*

Ask it the same questions. Where has it come from? Where is it going? What is it following?

Look downstream, as far as the trees let you. Past that, roads and buildings, drawn on paper. The water goes under them, in drains, all the way to the sea.

Look across the water. The car park.

Close your eyes. Listen under the water. The distributor again. You can hear it from every part of this campus, all day, every day.

Imagine the driver of one truck. Where are they going? What do they want?

Open your eyes.

**6. Back.** Turn round. Walk out the way you came in. Grass, platform, past the bed. Don't look at the tree yet.

Stop where you came in.

**7. Here again.** Turn round. Follow with your eyes everywhere you've been, out and back to your feet.

You drew that one. Look at the tree. The building behind it. The people in the windows, different people now.

Breathe with the tree. That's next year. And the year after. Keep going, until the building is gone.

Look at the tree. Close your eyes. The trucks on their line. The water on its. Which will be here longest?

Now you. What do you want?

## Example 2: "Between Blank Screens"

**Site:** starting in the stairwell, past a large screen (always off, left), a control room with a window onto the studio floor below, a three-screen array (always off), more control rooms, a lift, a communal space with booths extending twenty metres, then a window overlooking the car park and Mount Keira.

**1. Stairwell.**

Climb. Feel it in your legs.

Everyone who's ever climbed this has been carrying something. A thesis, a deadline, an idea, a dream, a future. A decision not yet spoken aloud.

Leave the stairs at the first floor. Turn around, to the right, past the lift.

Are there students seated in the sun to your right? Sit here for a second. Watch them.

*(voices, brief, overlapping, drifting from where they're sitting, real ambient bed underneath, birds, distant traffic, sun-warmed quiet)*

*"...if this actually works, I want to take it overseas, properly, not just..."*

*"...my parents don't get it, but I don't think it matters if they get it..."*

*"...honestly? I just want to wake up excited about it again..."*

*(fade)*

What do you think makes them happy? What future do you think they imagine for themselves?

Turn to find the corridor that leads west, toward Mount Keira, past the screens.

**2. The first screen.**

Stop at the screen. Look at it. Off.

Search for your reflection in the glass. It's there, faint, waiting for you to find it. Your own face, slowly becoming the picture.

What would you choose to put on this screen? What future do you imagine for yourself?

**3. The control room.**

Stop. There's a door here, into the room above the studio floor. This is where you decide.

*(If the door opens)* Go in. Look down through the glass, onto the floor below. Whether it's empty or someone's working down there doesn't matter.

*(If it's locked)* Stand at the door. Look through whatever glass or gap you can find. Imagine the floor below anyway, empty or not.

Decisions happen in a room like this one, about what happens down there. Who gets the space. What gets made. What doesn't.

Choose now, before you keep walking. Are you the one down there, doing the work? Or the one up here, deciding what work gets done? What needs making? What should be made?

Leave the room and return to the corridor.

**4. The three-screen array.**

More screens now. Off, like the first. So many screens, doing nothing.

*(a low, dead electrical hum sits under this beat, the sound of idle screens, making "doing nothing" something the listener actually hears)*

Screens like these fill the world now, waiting to be filled with something. What future is actually being made across all of them, for all of us, not just for you? What media do we need right now? And who's deciding that?

Keep walking.

**5. Past more control rooms.**

*(faint, decaying traces of things once made here, a snatch of dialogue from a shoot, a director's count, a fragment of a scene, half-heard through the doors, the ghost of production rather than any present activity)*

Behind each door, hands are doing something precise. Listen for it.

What are they building in there? Who are they building it for?

**6. The lift.**

The lift's doing nothing right now. Walk past it, into the alcove on your right.

**7. The booths.**

If there's a seat, take it. If not, stand and listen.

*(voices, brief, overlapping, drifting from nearby tables, real ambient bed of the space underneath)*

*"...told them I'd have it by Friday, I don't even..."*

*"...if I could just get outside for five minutes, I swear I'd..."*

*"...I keep thinking if I just get through this semester..."*

*(fade)*

None of that was for you. Let it go.

Imagine a different conversation instead, right at this table. You, ten years younger, sitting across from you. What would they ask? What would you have to admit to them?

Now imagine yourself, ten years from now, sitting where you are. What would they already know that you don't yet?

Let both of them go now. The one who needed you to explain yourself. The one who already knows how it turns out.

Just for a moment, be exactly the age you are, sitting exactly where you are.

**8. Walking on.**

Keep walking, toward the light at the end.

This building is only a few years old. Look at it properly, the surfaces, the finish, still reading as fresh, still reading as modern.

Ten years from now, none of that will hold. It'll look exactly as dated as everything it replaced.

Imagine yourself in ten years. How different will you look? How different will you feel? Who will you be by then?

**9. The window.**

Stop at the window. Look out.

*(real wind and traffic, recorded on location, rising as the listener turns to the glass, the living air of outside opening up after the dead hum of the corridor)*

The car park first. Ordinary people, thinking about dinner, or a deadline, or someone waiting for them.

Now the mountain, behind all of it. Not part of the institution. Not part of any of it.

It was here before every wall you've just walked past, and it will be here after them.

Breathe with it once. In. Out.

What future is already being made for this mountain, right now, whether anyone imagines it or not?

Everyone who's ever walked this corridor breathes the same air you're breathing. Stands under the same sky.

Breathe the shared air. In and out. In and out.

Notice the quality of the air in here. How would it be different on the mountain, amongst the spring wildflowers and the trees?

Breathe the shared air of the mountain. In and out. In and out.

**10. Return.**

Walk back. Don't stop.

As you pass each dark screen, put your hand up, close to the glass, not touching it. Feel the space between your palm and its surface.

Imagine that gap filled with light. Your own hands, somewhere behind that light, making it.

Pass the studio doors. Imagine your own voice, right now, filling one of those rooms.

Keep walking. Breathe once, the way you did with the mountain.

What would you choose to put on this screen now?
