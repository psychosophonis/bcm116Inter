## Beyond the single screen

Five step-by-steps that give you the tools to explore multiscreen, 360 and multipanel (videos collaged on one screen) work. All of this also applies to projection. Start at the **[Beyond the single screen](../ae-workshop/beyondsingle/)** page, which has this week's notes, student examples, and the Investigation 3 & 4 details.

This week I'm happy for you to work on last week's **[After Effects tutorial](../ae-workshop/)** if you missed it. These exercises extend it: if three people make three sketches in After Effects (based perhaps on one theme, object or watercolour) they'll make a nice three-screen triptych. The aim, whatever you do, is to look for potential project ideas for Investigations 3 & 4.

### The step-by-steps

- **[Panorama](../ae-workshop/beyondsingle/p-panorama/)** — a good place to start if you'd like to make work that combines video and collage in VR.
- **[Multipanel and panoramic video for VR](../ae-workshop/beyondsingle/v-ring/)** — arrange panels of video around the viewer and export for YouTube 360.
- **[Multipanel on one screen](../ae-workshop/beyondsingle/c-columns/)** — combine several shots on one screen, in columns or a grid.
- **[Remix time and space](../ae-workshop/beyondsingle/r-remix/)** — cut one shot into strips and start each strip at a different moment.
- **[Two or more screens](../ae-workshop/beyondsingle/t-triptych/)** — one sequence per screen, put side by side in Premiere for the screen array.

Coming from the planetarium? Everything here can work on the dome with a radial composition. For the code route, see **[The Dome as Canvas](../resources/dome-as-canvas.html)**.
